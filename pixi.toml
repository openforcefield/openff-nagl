[workspace]
authors = ["Open Force Field Initiative <info@openforcefield.org>"]
channels = ["conda-forge"]
name = "openff-nagl-docs"
platforms = ["linux-64", "osx-arm64"]

[tasks]

[feature.docs.dependencies]
python = "*"
pip = "*"
tqdm = "*"
openff-toolkit-base = ">=0.11.1"
openff-units = ">=0.4"
pydantic = "2.*"
rdkit = "*"
pyarrow = "*"
pytorch = ">=2.10"
pytorch-lightning = "*"
dask-jobqueue = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
codecov = "*"
myst-nb = "*"
myst-parser = ">=0.16"
docutils = "*"
sphinx = "6.*"
sphinx-notfound-page = "*"
autodoc-pydantic = "*"
sphinx-click = "*"

[feature.docs.pypi-dependencies]
openff-sphinx-theme = {
  git = "https://github.com/openforcefield/openff-sphinx-theme",
  rev = "main",
}
openff-nagl = { path = ".", editable = true }

[environments]
docs = [ "docs" ]
