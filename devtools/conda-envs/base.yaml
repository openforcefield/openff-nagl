name: openff-nagl-test
channels:
  - conda-forge
dependencies:
    # Base depends
  - python
  - pip

  # UI
  - tqdm

  # chemistry
  - openff-toolkit-base >=0.18
  - openff-nagl-models
  - openff-units >=0.4
  - pydantic =2
  - rdkit
  - scipy

  # files
  - pyyaml

  # gcn
  - pytorch >=2.11
  - pytorch-lightning

  # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - codecov
