# environment for testing cuda
name: openff-nagl-test-cuda
channels:
  - conda-forge
dependencies:
    # Base depends
  - python >=3.12
  - pip

  # Build deps - declare so AWS runner doesn't have to pull them
  - setuptools
  - setuptools-scm

  # UI
  - tqdm

  # chemistry
  - openff-recharge
  - openff-toolkit-base >=0.18
  - openff-nagl-models >=2025
  - openff-units
  - pydantic =2.11
  - rdkit
  - openeye::openeye-toolkits

  # database
  - pyarrow

  # gcn
  - dgl =2
  - torchdata <=0.10.0
  # torchvision
  # torchaudio
  - pytorch =2
  - pytorch-lightning
  - cuda-version >=11

  # parallelism
  - dask-jobqueue

  # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - codecov

  - rustworkx
