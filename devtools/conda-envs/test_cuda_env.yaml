# environment for testing cuda
name: openff-nagl-test-cuda
channels:
  - conda-forge
dependencies:
    # Base depends
  - python >=3.12
  - pip

  # UI
  - tqdm

  # chemistry
  - openff-recharge
  - openff-toolkit-base >=0.18
  - openff-nagl-models >=2025
  - openff-units
  - pydantic <3
  - rdkit
  - openeye::openeye-toolkits

  # database
  - pyarrow

  # gcn
  - dgl >=2.2
  # torchdata
  # torchvision
  # torchaudio
  - pytorch >=2.5
  - pytorch-lightning
  - cuda-version >=12.0

  # parallelism
  - dask-jobqueue

  # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - codecov
