[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
  "wheel",
]

[project]
name = "openff-nagl"
description = "A playground for applying graph convolutional networks to molecules."
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE", "LICENSE-3RD-PARTY", "AUTHORS.md" ]
maintainers = [
  { name = "Lily Wang", email = "lily.wang@openforcefield.org" },
]
authors = [
  { name = "Lily Wang", email = "lily.wang@openforcefield.org" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
optional-dependencies.doc = [
  "openff-sphinx-theme @ git+https://github.com/openforcefield/openff-sphinx-theme.git@main",
  "sphinx>=1.8",
]
optional-dependencies.test = [
  "pytest>=6",
  "pytest-cov>=3",
  "pytest-xdist>=2.5",
]
urls.documentation = "https://docs.openforcefield.org/projects/nagl/"
urls.source = "https://github.com/openforcefield/openff-nagl"

[tool.setuptools]
include-package-data = false
packages.find.include = [ "openff.nagl*" ]
packages.find.exclude = [ "openff.nagl.tests.data*" ]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 119
namespace-packages = [ "openff/nagl/" ]
lint.select = [ "E", "F", "I", "NPY", "RUF", "UP", "W" ]
lint.ignore = [ "RUF012" ]
lint.per-file-ignores."plugins/*" = [ "INP001" ]
lint.isort.known-first-party = [ "openff.nagl" ]
lint.isort.known-third-party = [ "openff.toolkit", "openff.utilities", "openff.units" ]

[tool.pytest]
ini_options.testpaths = [
  "openff/nagl/tests",
]

[tool.coverage]
run.omit = [
  "*/*/_tests/*",
  "openff/nagl/_version.py",
]
report.exclude_lines = [
  "@overload",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
